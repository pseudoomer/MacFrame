<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MacFrame Preferences</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }
    body {
      margin: 16px;
      font-size: 13px;
      line-height: 1.5;
    }
    .group {
      margin-bottom: 14px;
      padding: 12px;
      border-radius: 8px;
      background: rgba(128, 128, 128, 0.12);
    }
    .group h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 6px 0;
    }
    select, input[type="number"] {
      padding: 4px 8px;
      border-radius: 6px;
    }
    .hint {
      font-size: 11px;
      opacity: 0.72;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="group">
    <h3>General</h3>
    <div class="row">
      <label for="enabled">Enable MacFrame by default</label>
      <input type="checkbox" id="enabled" data-type="bool" data-pref-key="enabled" />
    </div>
    <div class="row">
      <label for="fps_mode">Target Frame Rate</label>
      <select id="fps_mode" data-pref-key="fps_mode">
        <option value="display">Match Display Refresh Rate (ProMotion 120Hz)</option>
        <option value="fixed_120">Fixed 120 fps</option>
        <option value="fixed_60">Fixed 60 fps</option>
        <option value="double">2x Source Frame Rate</option>
      </select>
    </div>
    <div class="row">
      <label for="preset">Content Preset</label>
      <select id="preset" data-pref-key="preset">
        <option value="film">Film / Drama (Balanced Smoothness & Halo Guard)</option>
        <option value="anime">Anime (2s/3s Cadence Dedup + Crisp Line Guard)</option>
        <option value="sports">Sports / Gaming (High-Speed Motion + Wide Search)</option>
      </select>
    </div>
    <div class="row">
      <label for="backend">Interpolation Engine Backend</label>
      <select id="backend" data-pref-key="backend">
        <option value="mflow">MF-Flow (Metal Native 3DRS + DIS Optical Flow)</option>
        <option value="vtfrc">Apple VT-FRC (VideoToolbox ML + Artifact Guard)</option>
        <option value="auto">Auto Select</option>
      </select>
    </div>
  </div>

  <div class="group">
    <h3>Artifact Mitigation Guards</h3>
    <div class="row">
      <label for="scene">Scene Cut Protection (Zero Cut Ghosting)</label>
      <input type="checkbox" id="scene" data-type="int" data-pref-key="scene" />
    </div>
    <div class="row">
      <label for="dedup">Anime 2s/3s Duplicate Frame Cadence Reconstruction</label>
      <input type="checkbox" id="dedup" data-type="int" data-pref-key="dedup" />
    </div>
    <div class="row">
      <label for="static_lock">Static HUD / Logo / Scoreboard / Subtitle Lock</label>
      <input type="checkbox" id="static_lock" data-type="int" data-pref-key="static_lock" />
    </div>
    <div class="row">
      <label for="letterbox">Letterbox Black Bar Boundary Protection</label>
      <input type="checkbox" id="letterbox" data-type="int" data-pref-key="letterbox" />
    </div>
    <div class="row">
      <label for="governor">Adaptive Performance Governor (Q4..Q0)</label>
      <input type="checkbox" id="governor" data-type="int" data-pref-key="governor" />
    </div>
    <div class="hint">
      Shortcuts inside IINA: <b>⌘⇧M</b> Toggle On/Off · <b>⌘⇧1/2/3</b> Switch Preset · <b>⌘⇧O</b> Live HUD
    </div>
  </div>
</body>
</html>
